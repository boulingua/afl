# ─────────────────────────────────────────────────────────────────────────
# afl — Arabic (Modern Standard Arabic) course. Instantiated from the
# canonical boulingua template (pagegen); only the marked values differ.
#
# Medium of instruction is English (site chrome + scaffolding prose); every
# Arabic run is wrapped by the {{< ar >}} shortcode in `dir="rtl" lang="ar"`,
# so the page itself stays LTR and the bidirectional algorithm is driven
# explicitly rather than left to chance. See ROADMAP.md §2.
# ─────────────────────────────────────────────────────────────────────────

baseURL = "https://boulingua.github.io/afl/"
title = "Arabic (MSA) — S. Le Boulanger"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = false
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup.highlight]
  noClasses = false

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = false

# Tags are DECLARED, not implicit — derive them from structured fields.
[taxonomies]
  tag = "tags"
  skill = "skills"
  level = "levels"
  topic = "topics"

[params]
  navTitle = "Arabic"
  author = "S. Le Boulanger"
  description = "A course in Modern Standard Arabic — a pre-A1 script stage plus CEFR A1 to B1, with vocalised texts, right-to-left typography, exams, materials and native-voice audio."
  keywords = "arabic,MSA,fusha,CEFR,RTL,course,OER"
  dateFormat = "2006-01-02"
  since = 2026
  colorScheme = "auto"
  hideCredits = true
  # The colour-scheme toggle is a labelled control in the navbar
  # (layouts/_partials/header.html); disable the theme's floating duplicate
  # so there is exactly one toggle on the page.
  hideColorSchemeToggle = true
  customCSS = ["css/custom.css"]
  # Site code — selects this course's accent from data/accents.yaml
  # (afl: #4A23C7 light / #977EE7 dark). Never edit the CSS for this.
  code = "afl"
  # Content licence, surfaced by pdf attribution + legal pages.
  license = "CC BY-SA 4.0"

  # IMPORTANT — every sub-table under [params] MUST come AFTER all bare
  # [params] keys. TOML scopes everything after a header to that header, so
  # opening [params.plausible] before the keys above would silently move them
  # under params.plausible and leave the site unstyled. Keep this block LAST.
  [params.plausible]
    # Privacy-friendly, cookieless analytics on the author's self-hosted
    # instance (server in Germany) — see /datenschutz/.
    domain = "boulingua.github.io/afl"
    src = "https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"

[[params.social]]
  name = "GitHub"
  icon = "fa-brands fa-github fa-2x"
  weight = 1
  url = "https://github.com/boulingua/afl"

